<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المستوى المتوسط | أكاديمية وصاب</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f1f3ff;color:#18244a}.wrap{max-width:1050px;margin:auto;padding:25px}.brand{text-align:center;color:#4054c9;font-weight:bold}.hero{text-align:center}.hero h1{font-size:42px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 25px #243c7c15}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:18px;text-align:center;border:2px solid #e0e5fa;border-radius:17px;cursor:pointer}.en{direction:ltr;font-size:25px;font-weight:bold;color:#334bb0}.ar{font-weight:bold;margin:8px}.ex{direction:ltr;color:#65718b;font-size:13px}.choices{display:grid;gap:9px}.choice,button{border:0;border-radius:12px;padding:12px;font:inherit;font-weight:bold;cursor:pointer}.choice{text-align:left;direction:ltr;background:#edf0ff;color:#283a80}.reset{background:#4057d8;color:#fff}.stats{text-align:center;color:#ad7600;font-weight:bold}.feedback{text-align:center;min-height:30px}.back{text-align:center;margin-top:20px}.back a{display:inline-block;background:#4057d8;color:#fff;padding:12px 18px;border-radius:12px;text-decoration:none}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="brand">أكاديمية وصاب لإتقان اللغة الإنجليزية</div><div class="hero"><div>📘 المستوى المتوسط · Intermediate</div><h1>طوّر لغتك وتحدث بثقة</h1><p>هذا المستوى مستقل: بطاقات تفاعلية + تحدث معي.</p></div><div class="grid"><section class="panel"><h2>🃏 البطاقات التفاعلية</h2><div class="cards" id="cards"></div></section><section class="panel"><h2>🗣️ تحدث معي</h2><div class="stats" id="stats">⭐ 0 نقطة · 🔥 0</div><p id="q"></p><p>اختر الرد الأكثر طبيعية من خمسة خيارات:</p><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><button class="reset" onclick="restart()">🔄 إعادة المحادثة</button></section></div><div class="back"><a href="../levels.html">← العودة إلى اختيار المستويات</a></div></div><script>const cards=[['Improve','يُحسّن / يطوّر','I want to improve my English.'],['Achieve','يحقّق','You can achieve your goals.'],['Challenge','تحدٍّ','Learning a language is a challenge.'],['Opportunity','فرصة','This is a great opportunity.'],['Experience','خبرة / تجربة','She has a lot of experience.'],['Confident','واثق','I feel confident when I practise.'],['Avoid','يتجنّب','Try to avoid common mistakes.'],['Suggest','يقترح','Can you suggest a good book?'],['Reservation','حجز','I have a reservation for two nights.'],['Deadline','موعد نهائي','The deadline is next Monday.']];cards.forEach(x=>{let d=document.createElement('div');d.className='card';d.innerHTML='<div class="en">'+x[0]+'</div><div class="ar">'+x[1]+'</div><div class="ex">'+x[2]+'</div>';d.onclick=()=>speak(x[0]);document.getElementById('cards').appendChild(d)});const scenarios=[['How do you improve your English?',['I am a banana.','It is next to the bank.','I practise every day.','Good night.','I need a ticket.'],2],['What do you think about learning a language?',['I need a ticket.','It is challenging, but I enjoy it.','Good night.','I am from Yemen.','Open the window.'],1],['Can you suggest a good book?',['I am from Yemen.','Open the window.','It is very expensive.','Yes, I can suggest one.','Good evening.'],3],['Are you confident when you speak English?',['It is very expensive.','Thank you, yesterday.','I am at the airport.','I am becoming more confident.','I like football.'],3],['What are you preparing for?',['This is my chair.','I am preparing for my exam.','I like football.','It is Monday morning.','I am at the airport yesterday.'],1],['Do you have a reservation?',['I like football.','It is Monday morning.','Yes, I have a reservation.','I am from Yemen.','Good night.'],2]];let step=0,score=0,streak=0;function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}function render(){let s=scenarios[step];document.getElementById('q').textContent=s[0];document.getElementById('choices').innerHTML='';s[1].forEach((x,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>answer(i);document.getElementById('choices').appendChild(b)});document.getElementById('feedback').textContent='';document.getElementById('stats').textContent='⭐ '+score+' نقطة · 🔥 '+streak;speak(s[0])}function answer(i){let correct=scenarios[step][2];if(i===correct){score+=15;streak++;document.getElementById('feedback').textContent='🎉 ممتاز! رد طبيعي وصحيح.';step=(step+1)%scenarios.length;setTimeout(render,750)}else{streak=0;document.getElementById('feedback').textContent='💪 إجابة غير صحيحة، حاول اختيار رد آخر.'}}function restart(){step=0;score=0;streak=0;render()}render();</script></body></html>
