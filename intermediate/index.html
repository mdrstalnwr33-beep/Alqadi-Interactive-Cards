<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#283b9b"><title>المستوى المتوسط | أكاديمية وصاب</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef2ff,#f7efff);font-family:Tahoma,Arial,sans-serif;color:#18244a}.wrap{width:min(1050px,94%);margin:auto;padding:25px 0 45px}.brand{text-align:center;color:#4054c9;font-weight:bold}.hero{text-align:center;padding:18px}.hero h1{font-size:clamp(30px,7vw,48px);margin:10px}.hero p{color:#68738d;line-height:1.8}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.panel{background:#fff;border:1px solid #e0e5fa;border-radius:24px;padding:20px;box-shadow:0 12px 35px #243c7c12}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{min-height:155px;border:2px solid #e2e7fb;border-radius:18px;background:linear-gradient(145deg,#fff,#f4f5ff);padding:18px;text-align:center;cursor:pointer}.en{direction:ltr;font-size:25px;font-weight:900;color:#334bb0}.ar{font-weight:bold;color:#713e9b;margin-top:8px}.ex{direction:ltr;color:#596781;font-size:13px;line-height:1.6;margin-top:8px}.chatbox{background:#f1f4ff;border-radius:18px;padding:16px;margin-bottom:12px}.enq{direction:ltr;font-size:19px;font-weight:bold}.choices{display:grid;gap:9px}.choice{direction:ltr;text-align:left;width:100%;border:0;border-radius:13px;padding:12px;background:#edf0ff;color:#283a80;font:inherit;font-weight:bold;cursor:pointer}.stats{text-align:center;color:#ad7600;font-weight:bold;margin:10px}.feedback{text-align:center;min-height:28px;font-weight:bold}.reset,.back a{border:0;border-radius:13px;padding:12px 17px;background:#4057d8;color:#fff;font:inherit;font-weight:bold;cursor:pointer;text-decoration:none}.back{text-align:center;margin-top:20px}.back a{display:inline-block}@media(max-width:760px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="brand">أكاديمية وصاب لإتقان اللغة الإنجليزية</div><div class="hero"><div>📘 المستوى المتوسط · Intermediate A2–B1</div><h1>طوّر لغتك وتحدث بثقة</h1><p>بطاقات تفاعلية مع أمثلة عملية، ثم طبّق ما تعلمته مباشرة في «تحدث معي».</p></div><div class="grid"><section class="panel"><h2>🃏 البطاقات التفاعلية</h2><div class="cards" id="cards"></div></section><section class="panel"><h2>🗣️ تحدث معي</h2><div class="stats" id="stats">⭐ 0 نقطة · 🔥 0</div><div class="chatbox"><div class="enq" id="q"></div><div>اختر الرد الأكثر طبيعية:</div></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><button class="reset" onclick="restart()">🔄 إعادة المحادثة</button></section></div><div class="back"><a href="../levels.html">← العودة إلى المستويات الرئيسية</a></div></div><script>const cards=[['Improve','يُحسّن / يطوّر','I want to improve my English.'],['Achieve','يحقّق','You can achieve your goals.'],['Challenge','تحدٍّ','Learning a language is a challenge.'],['Opportunity','فرصة','This is a great opportunity.'],['Experience','خبرة / تجربة','She has a lot of experience.'],['Confident','واثق','I feel confident when I practise.'],['Avoid','يتجنّب','Try to avoid common mistakes.'],['Suggest','يقترح','Can you suggest a good book?'],['Reservation','حجز','I have a reservation for two nights.'],['Deadline','موعد نهائي','The deadline is next Monday.']];cards.forEach(x=>{let d=document.createElement('div');d.className='card';d.innerHTML='<div class="en">'+x[0]+'</div><div class="ar">'+x[1]+'</div><div class="ex">'+x[2]+'</div>';d.onclick=()=>speak(x[0]);document.getElementById('cards').appendChild(d)});const scenarios=[['How do you improve your English?',['I practise every day.','I am a banana.','It is next to the bank.']],['What do you think about learning a language?',['It is challenging, but I enjoy it.','I need a ticket.','Good night.']],['Can you suggest a good book?',['Yes, I can suggest one.','I am from Yemen.','Open the window.']],['Are you confident when you speak English?',['I am becoming more confident.','It is very expensive.','Thank you, yesterday.']],['What are you preparing for?',['I am preparing for my exam.','I am at the airport yesterday.','This is my chair.']],['Do you have a reservation?',['Yes, I have a reservation.','I like football.','It is Monday morning.']]];let step=0,score=0,streak=0;function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}function render(){let s=scenarios[step];document.getElementById('q').textContent=s[0];document.getElementById('choices').innerHTML='';s[1].forEach((x,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>answer(i);document.getElementById('choices').appendChild(b)});document.getElementById('feedback').textContent='';document.getElementById('stats').textContent='⭐ '+score+' نقطة · 🔥 '+streak;speak(s[0])}function answer(i){if(i===0){score+=15;streak++;step=(step+1)%scenarios.length;document.getElementById('feedback').textContent='🎉 ممتاز! رد طبيعي وصحيح.'}else{streak=0;document.getElementById('feedback').textContent='💪 حاول مرة أخرى — اختر الرد الأكثر طبيعية.'}document.getElementById('stats').textContent='⭐ '+score+' نقطة · 🔥 '+streak;setTimeout(render,750)}function restart(){step=0;score=0;streak=0;render()}render();</script></body></html>
