<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المستوى المبتدئ | أكاديمية وصاب</title><style>body{margin:0;font-family:Tahoma,Arial;background:#eefcf7;color:#17243f}.wrap{max-width:1000px;margin:auto;padding:25px}.brand{text-align:center;color:#167654;font-weight:bold}.hero{text-align:center}.hero h1{font-size:42px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 25px #173d2a15}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:18px;text-align:center;border:2px solid #dce9e3;border-radius:17px;cursor:pointer}.en{direction:ltr;font-size:27px;font-weight:bold;color:#13734f}.ar{font-weight:bold;margin:8px}.ex{direction:ltr;color:#65718b;font-size:13px}.choices{display:grid;gap:9px}.choice,button{border:0;border-radius:12px;padding:12px;font:inherit;font-weight:bold;cursor:pointer}.choice{text-align:left;direction:ltr;background:#edf1ff;color:#263b83}.secondary{background:#eef1ff}.stats{text-align:center;color:#b77b00;font-weight:bold}.feedback{text-align:center;min-height:30px}.back{text-align:center;margin-top:20px}.back a{display:inline-block;background:#1c8b61;color:#fff;padding:12px 18px;border-radius:12px;text-decoration:none}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="brand">أكاديمية وصاب لإتقان اللغة الإنجليزية</div><div class="hero"><div>🌱 المستوى المبتدئ · Beginner</div><h1>تعلّم الإنجليزية خطوة بخطوة</h1><p>بطاقات تفاعلية + نطق + محادثة للمبتدئين.</p></div><div class="grid"><section class="panel"><h2>🃏 البطاقات التفاعلية</h2><div class="cards" id="cards"></div></section><section class="panel"><h2>🗣️ تحدث معي</h2><div class="stats" id="stats">⭐ 0 نقطة · 🔥 0</div><p id="q"></p><p>اختر أفضل رد من خمسة خيارات:</p><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><button class="secondary" onclick="restart()">🔄 إعادة المحادثة</button></section></div><div class="back"><a href="../levels.html">← العودة إلى اختيار المستويات</a></div></div><script>const cards=[['Hello','مرحبًا','Hello! How are you?'],['Good morning','صباح الخير','Good morning, teacher.'],['Thank you','شكرًا','Thank you very much.'],['Please','من فضلك','Please sit here.'],['Sorry','آسف','I am sorry.'],['Goodbye','إلى اللقاء','Goodbye! See you tomorrow.'],['Friend','صديق','He is my friend.'],['Teacher','معلم','She is my English teacher.'],['Book','كتاب','This is my book.'],['School','مدرسة','I go to school every day.']];cards.forEach(x=>{let d=document.createElement('div');d.className='card';d.innerHTML='<div class="en">'+x[0]+'</div><div class="ar">'+x[1]+'</div><div class="ex">'+x[2]+'</div>';d.onclick=()=>speak(x[0]);document.getElementById('cards').appendChild(d)});const scenarios=[['Hello! What is your name?',['I am a student.','It is Monday.','My name is Ahmed.','Good night.','I like apples.'],2],['Nice to meet you! How are you?',['I am fine, thank you.','I am in the kitchen.','It is a book.','See you tomorrow.','I am from Yemen.'],0],['Where are you from?',['I am twelve years old.','Good night.','I am from Yemen.','I am a teacher.','It is blue.'],2],['What do you do?',['It is very big.','I am a student.','Thank you.','I live in Sana’a.','Good evening.'],1],['Do you like English?',['I am at school.','Open the door.','It is Monday.','Yes, I love English.','My name is Ahmed.'],3],['See you tomorrow! What do you say?',['I am a teacher.','This is my bag.','Good morning.','I am from Yemen.','Goodbye! See you tomorrow.'],4]];let step=0,score=0,streak=0;function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function render(){let s=scenarios[step];document.getElementById('q').textContent=s[0];document.getElementById('choices').innerHTML='';s[1].forEach((x,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>answer(i);document.getElementById('choices').appendChild(b)});document.getElementById('feedback').textContent='';document.getElementById('stats').textContent='⭐ '+score+' نقطة · 🔥 '+streak;speak(s[0])}function answer(i){let correct=scenarios[step][2];if(i===correct){score+=10;streak++;document.getElementById('feedback').textContent='🎉 ممتاز! إجابة صحيحة.';step=(step+1)%scenarios.length;setTimeout(render,700)}else{streak=0;document.getElementById('feedback').textContent='💪 إجابة غير صحيحة، حاول اختيار رد آخر.'}}function restart(){step=0;score=0;streak=0;render()}render();</script></body></html>
