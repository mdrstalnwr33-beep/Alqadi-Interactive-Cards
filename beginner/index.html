<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#126e4f"><title>المستوى المبتدئ | أكاديمية وصاب</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eefcf7,#eef4ff);font-family:Tahoma,Arial,sans-serif;color:#17243f}.wrap{width:min(1000px,94%);margin:auto;padding:25px 0 45px}.brand{text-align:center;color:#167654;font-weight:bold}.hero{text-align:center;padding:18px}.hero h1{font-size:clamp(30px,7vw,48px);margin:10px}.hero p{color:#65718b;line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid #dce9e3;border-radius:24px;padding:20px;box-shadow:0 12px 35px #173d2a12}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{min-height:150px;border:2px solid #e1eee8;border-radius:18px;background:linear-gradient(145deg,#fff,#f0fbf6);padding:18px;text-align:center;display:flex;flex-direction:column;justify-content:center;cursor:pointer}.en{direction:ltr;font-size:27px;font-weight:900;color:#13734f}.ar{font-weight:bold;color:#6b3e8d;margin-top:9px}.ex{direction:ltr;color:#607087;font-size:13px;margin-top:8px;line-height:1.6}.hidden{display:none!important}.chatbox{background:#f3f7ff;border-radius:18px;padding:16px;margin-bottom:12px}.enq{direction:ltr;font-weight:bold;font-size:19px}.choices{display:grid;gap:9px}.choice,button{border:0;border-radius:13px;padding:12px 15px;font:inherit;font-weight:bold;cursor:pointer}.choice{direction:ltr;text-align:left;background:#edf1ff;color:#263b83}.primary{background:#1c8b61;color:#fff}.secondary{background:#eef1ff;color:#293b83}.stats{text-align:center;color:#b77b00;font-weight:bold;margin:10px}.feedback{text-align:center;min-height:28px;font-weight:bold}.back{text-align:center;margin-top:20px}.back a{display:inline-block;text-decoration:none;background:#1c8b61;color:#fff;padding:12px 18px;border-radius:13px;font-weight:bold}@media(max-width:760px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="brand">أكاديمية وصاب لإتقان اللغة الإنجليزية</div><div class="hero"><div>🌱 المستوى المبتدئ · Beginner</div><h1>تعلّم الإنجليزية خطوة بخطوة</h1><p>بطاقات تفاعلية + نطق + محادثة للمبتدئين.</p></div><div class="grid"><section class="panel"><h2>🃏 البطاقات التفاعلية</h2><div class="cards" id="cards"></div></section><section class="panel"><h2>🗣️ تحدث معي</h2><div class="stats" id="stats">⭐ 0 نقطة · 🔥 0</div><div class="chatbox"><div class="enq" id="q"></div><div>اختر أفضل رد باللغة الإنجليزية:</div></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><button class="secondary" onclick="restart()">🔄 إعادة المحادثة</button></section></div><div class="back"><a href="../levels.html">← العودة إلى المستويات الرئيسية</a></div></div><script>const cards=[['Hello','مرحبًا','Hello! How are you?'],['Good morning','صباح الخير','Good morning, teacher.'],['Thank you','شكرًا','Thank you very much.'],['Please','من فضلك','Please sit here.'],['Sorry','آسف','I am sorry.'],['Goodbye','إلى اللقاء','Goodbye! See you tomorrow.'],['Friend','صديق','He is my friend.'],['Teacher','معلم','She is my English teacher.'],['Book','كتاب','This is my book.'],['School','مدرسة','I go to school every day.']];const scenarios=[['Hello! What is your name?',['My name is Ahmed.','I am a banana.','It is Monday.']],['Nice to meet you! How are you?',['I am fine, thank you.','I am in the kitchen.','It is a book.']],['Where are you from?',['I am from Yemen.','I am twelve years old.','Good night.']],['What do you do?',['I am a student.','It is very big.','Thank you.']],['Do you like English?',['Yes, I love English.','I am at school yesterday.','Open the door.']],['See you tomorrow! What do you say?',['Goodbye! See you tomorrow.','I am a teacher.','This is my bag.']]];let step=0,score=0,streak=0;const c=document.getElementById('cards');cards.forEach(x=>{const d=document.createElement('div');d.className='card';d.innerHTML='<div class="en">'+x[0]+'</div><div class="ar">'+x[1]+'</div><div class="ex">'+x[2]+'</div>';d.onclick=()=>speak(x[0]);c.appendChild(d)});function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function render(){let s=scenarios[step];document.getElementById('q').textContent=s[0];document.getElementById('choices').innerHTML='';s[1].forEach((x,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>answer(i);document.getElementById('choices').appendChild(b)});document.getElementById('feedback').textContent='';document.getElementById('stats').textContent='⭐ '+score+' نقطة · 🔥 '+streak;speak(s[0])}function answer(i){if(i===0){score+=10;streak++;document.getElementById('feedback').textContent='🎉 ممتاز! إجابة صحيحة.';step=(step+1)%scenarios.length}else{streak=0;document.getElementById('feedback').textContent='💪 حاول مرة أخرى — الخيار الأول هو الأفضل.'}document.getElementById('stats').textContent='⭐ '+score+' نقطة · 🔥 '+streak;setTimeout(render,700)}function restart(){step=0;score=0;streak=0;render()}render();</script></body></html>
