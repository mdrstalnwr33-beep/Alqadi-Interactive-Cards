<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#3158d8"><title>تحدث معي | المستوى المبتدئ | أكاديمية وصاب</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;color:#18254b;background:linear-gradient(135deg,#eef6ff,#f8edff,#fff8e7)}.wrap{width:min(900px,94%);margin:auto;padding:24px 0 45px}.brand{text-align:center;color:#3158d8;font-weight:bold}.hero{text-align:center;padding:18px 10px}.hero h1{font-size:clamp(30px,7vw,48px);margin:10px 0;color:#243e9a}.hero p{line-height:1.8;color:#64718d}.panel{background:#ffffffec;border:1px solid #dfe6fa;border-radius:25px;padding:20px;margin:16px 0;box-shadow:0 12px 35px #29428c14}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.stat{background:#eef2ff;border-radius:30px;padding:9px 14px;font-weight:bold}.bubble{background:#f0f4ff;border-radius:20px;padding:18px;line-height:1.8;margin:16px 0}.en{direction:ltr;text-align:left;font-size:20px;font-weight:bold;color:#243e9a}.choices{display:grid;gap:11px}.choice{width:100%;border:0;border-radius:15px;padding:14px;background:#3158d8;color:#fff;font:inherit;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #203fa7}.choice:disabled{opacity:.7}.feedback{text-align:center;min-height:45px;margin:14px 0;font-weight:bold;font-size:18px}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button.secondary,a{border:0;border-radius:14px;padding:12px 18px;background:#fff;color:#29418f;font:inherit;font-weight:bold;text-decoration:none;box-shadow:0 3px 0 #d5ddfa;cursor:pointer}.back{margin-top:18px;text-align:center}.good{color:#16804a}.bad{color:#bd3030}</style></head><body><div class="wrap"><div class="brand">أكاديمية وصاب لإتقان اللغة الإنجليزية</div><div class="hero"><div>🌱 المستوى المبتدئ</div><h1>🗣️ تحدث معي</h1><p>تدرّب على جمل إنجليزية سهلة خطوة بخطوة. اختر الرد المناسب واستمع للنطق.</p></div><section class="panel"><div class="stats"><span class="stat" id="score">⭐ 0 نقطة</span><span class="stat" id="streak">🔥 سلسلة 0</span><span class="stat" id="step">المحادثة 1/6</span></div><div id="chat"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div><div class="buttons"><button class="secondary" id="restart">🔄 إعادة المحادثة</button><button class="secondary" id="speak">🔊 استمع للسؤال</button></div></section><div class="back"><a href="../">← العودة إلى بطاقات المستوى المبتدئ</a></div></div><script>const scenarios=[['Hello! What is your name?',['My name is Ahmed.','I am in the kitchen.','I like apples.']],['Nice to meet you, Ahmed! How are you?',['I am fine, thank you.','It is a book.','Good night, airport.']],['Where are you from?',['I am from Yemen.','I am a teacher.','It is five o’clock.']],['What do you do?',['I am a student.','I am at the bank.','This is my bag.']],['What do you like?',['I like English.','I am ten years old.','Open the door.']],['Great! See you tomorrow. What do you say?',['Goodbye! See you tomorrow.','I want some water.','Where is the hospital?']]];let i=0,score=0,streak=0;const $=id=>document.getElementById(id);function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function render(){const s=scenarios[i];$('step').textContent='المحادثة '+(i+1)+'/'+scenarios.length;$('score').textContent='⭐ '+score+' نقطة';$('streak').textContent='🔥 سلسلة '+streak;$('chat').innerHTML='<div class="bubble"><div class="en">'+s[0]+'</div><div>فكّر في الرد المناسب.</div></div>';$('choices').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';s[1].forEach((text,n)=>{const b=document.createElement('button');b.className='choice';b.textContent=text;b.onclick=()=>answer(n);$('choices').appendChild(b)});speak(s[0])}function answer(n){[...$('choices').children].forEach(b=>b.disabled=true);if(n===0){score+=10;streak++;$('feedback').textContent='🎉 ممتاز! هذا رد صحيح ومناسب.';$('feedback').className='feedback good';i++;if(i>=scenarios.length){setTimeout(finish,700);return}}else{streak=0;$('feedback').textContent='💪 حاول مرة أخرى. اختر الرد الأكثر مناسبة للموقف.';$('feedback').className='feedback bad'}$('score').textContent='⭐ '+score+' نقطة';$('streak').textContent='🔥 سلسلة '+streak;if(n===0)setTimeout(render,700)}function finish(){$('chat').innerHTML='<div class="bubble" style="text-align:center"><h2>🏆 أحسنت!</h2><div>أنهيت محادثة المستوى المبتدئ.</div><strong style="font-size:32px;color:#3158d8">'+score+' نقطة</strong></div>';$('choices').innerHTML='';$('feedback').textContent='🌟 كرر المحادثة مرة أخرى لتصبح أكثر ثقة.';$('step').textContent='اكتملت المحادثة 🎉';$('score').textContent='⭐ '+score+' نقطة';$('streak').textContent='🔥 سلسلة '+streak}$('restart').onclick=()=>{i=0;score=0;streak=0;render()};$('speak').onclick=()=>speak(scenarios[Math.min(i,scenarios.length-1)][0]);render();</script></body></html>
